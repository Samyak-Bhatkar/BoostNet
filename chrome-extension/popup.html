<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #262933;
      padding-bottom: 10px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      font-weight: 600;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand-title">⚡ BoostNet</span>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="control-row">
    <span>Auto-Intercept Downloads (&gt;2MB)</span>
    <input type="checkbox" id="chk-auto-intercept" checked/>
  </div>

  <div class="control-row">
    <span>Proxy Address</span>
    <code style="color: #06b6d4;">127.0.0.1:9050</code>
  </div>

  <button class="btn" id="btn-open-dashboard">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
